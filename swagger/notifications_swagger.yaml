openapi: 3.0.0
info:
  title: User API
  description: API for user notifications
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /notifications/{user_id}:
    get:
      summary: Get notifications
      description: Retrieve all notifications 
      tags:
        - Notifications
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: A list of notifications with details from related entities.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    notification_id:
                      type: integer
                      example: 12
                    user_id:
                      type: integer
                      example: 3
                    title:
                      type: string
                      description: The title of the related board, chat room, or group chat room.
                      example: "Work Chat"
                    last_message:
                      type: string
                      description: The last message or notification message depending on the type of notification.
                      example: "Discussing project details and deadlines."
        '401':
          description: Unauthorized
        '404':
          description: No notifications found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "No notifications found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error"
      security:
        - sessionAuth: []
  /notifications:
    post:
      summary: Create a new notification
      description: Creates a new notification for a user
      tags:
        - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                board_id:
                  type: integer
                chatroom_id:
                  type: integer
                group_chatroom_id:
                  type: integer
                message:
                  type: string
              required:
                - user_id
                - message
      responses:
        '201':
          description: Notification created
        '400':
          description: Invalid input
        '500':
          description: Internal server error
      security:
        - sessionAuth: []
    delete:
      summary: Delete a notification
      description: Deletes a specific notification by its ID and user ID
      tags:
        - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                notification_id:
                  type: integer
              required:
                - user_id
                - notification_id
      responses:
        '200':
          description: Notification deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Notification deleted successfully
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Notification not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal server error
      security:
        - sessionAuth: []
  /notifications/{notification_id}/read:
    put:
      summary: Mark a notification as read
      description: Marks a specific notification as read
      tags:
        - Notifications
      parameters:
        - in: path
          name: notification_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Notification marked as read
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Notification not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal server error
      security:
        - sessionAuth: []
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: connect.sid # express-session의 기본 쿠키 이름
security:
  - sessionAuth: []
