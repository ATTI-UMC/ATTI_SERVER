openapi: 3.0.0
info:
  title: Board API
  description: API for managing board posts
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local server

paths:
  /board:
    post:
      summary: Create a new board post
      tags:
        - Board
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - board_type
                - user_id
                - nickname
                - title
                - content
              properties:
                board_type:
                  type: string
                  description: counseling, education, mentoring 중 하나
                user_id:
                  type: integer
                  description: The ID of the user creating the post
                nickname:
                  type: string
                  description: The nickname of the user creating the post
                title:
                  type: string
                  description: The title of the board post
                content:
                  type: string
                  description: The content of the board post
                images:
                  type: array
                  description: 업로드할 사진 파일들
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Board post created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  postId:
                    type: integer
                  redirectUrl:
                    type: string
        '500':
          description: Internal Server Error

  /board/{id}:
    get:
      summary: Get a board post by ID
      tags:
        - Board
      parameters:
        - in: path
          name: board_id
          schema:
            type: integer
          required: true
          description: The ID of the board post to retrieve
      responses:
        '200':
          description: Board post retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  board_id:
                    type: integer
                  board_type:
                    type: string
                  user_id:
                    type: integer
                  nickname:
                    type: string
                  title:
                    type: string
                  content:
                    type: string
                  like_count:
                    type: integer
                  comment_count:
                    type: integer
                  scrap_count:
                    type: integer
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                  images:
                    type: array
                    items:
                      type: string
                  comments:
                    type: array
                    items:
                      type: object
                      properties:
                        comment_id:
                          type: integer
                        user_id:
                          type: integer
                        nickname:
                          type: string
                        content:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
        '404':
          description: Board post not found
        '500':
          description: Internal Server Error

    put:
      summary: Update a board post
      tags:
        - Board
      parameters:
        - in: path
          name: board_id
          schema:
            type: integer
          required: true
          description: The ID of the board post to update
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - content
              properties:
                title:
                  type: string
                  description: The title of the board post
                content:
                  type: string
                  description: The content of the board post
                images:
                  type: array
                  description: 수정된 이미지 파일들
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Board post updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  redirectUrl:
                    type: string
        '404':
          description: Board post not found
        '500':
          description: Internal Server Error

    delete:
      summary: Delete a board post
      tags:
        - Board
      parameters:
        - in: path
          name: board_id
          schema:
            type: integer
          required: true
          description: The ID of the board post to delete
      responses:
        '200':
          description: Board post deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
        '404':
          description: Board post not found
        '500':
          description: Internal Server Error

  /boardtype/{board_type}:
    get:
      summary: Get board posts by board type with pagination
      tags:
        - Board
      parameters:
        - in: path
          name: board_type
          schema:
            type: string
          required: true
          description: The type of the board posts to retrieve
        - in: query
          name: paging_num
          schema:
            type: integer
            description: Number of posts to retrieve
        - in: query
          name: lastCreatedAt
          schema:
            type: string
            format: date-time
            description: The timestamp of the last post retrieved
      responses:
        '200':
          description: Board posts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                    content:
                      type: string
                    like_count:
                      type: integer
                    scrap_count:
                      type: integer
                    comment_count:
                      type: integer
                    updated_at:
                      type: string
                      format: date-time
                    nickname:
                      type: string
        '404':
          description: No more board posts found
        '500':
          description: Internal Server Error

  /liked-posts:
    get:
      summary: Get posts liked by the user
      tags:
        - Board
      parameters:
        - in: query
          name: user_id
          schema:
            type: integer
          required: true
          description: The ID of the user
        - in: query
          name: paging_num
          schema:
            type: integer
            description: Number of posts to retrieve
        - in: query
          name: lastCreatedAt
          schema:
            type: string
            format: date-time
            description: The timestamp of the last post retrieved
      responses:
        '200':
          description: Liked posts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                    content:
                      type: string
                    comment_count:
                      type: integer
                    like_count:
                      type: integer
                    scrap_count:
                      type: integer
                    updated_at:
                      type: string
                      format: date-time
                    nickname:
                      type: string
        '404':
          description: No more liked posts found
        '500':
          description: Internal Server Error

  /scrapped-posts:
    get:
      summary: Get posts scrapped by the user
      tags:
        - Board
      parameters:
        - in: query
          name: user_id
          schema:
            type: integer
          required: true
          description: The ID of the user
        - in: query
          name: paging_num
          schema:
            type: integer
            description: Number of posts to retrieve
        - in: query
          name: lastCreatedAt
          schema:
            type: string
            format: date-time
            description: The timestamp of the last post retrieved
      responses:
        '200':
          description: Scrapped posts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                    content:
                      type: string
                    comment_count:
                      type: integer
                    like_count:
                      type: integer
                    scrap_count:
                      type: integer
                    updated_at:
                      type: string
                      format: date-time
                    nickname:
                      type: string
        '404':
          description: No more scrapped posts found
        '500':
          description: Internal Server Error

  /commented-posts:
    get:
      summary: Get posts commented by the user
      tags:
        - Board
      parameters:
        - in: query
          name: user_id
          schema:
            type: integer
          required: true
          description: The ID of the user
        - in: query
          name: paging_num
          schema:
            type: integer
            description: Number of posts to retrieve
        - in: query
          name: lastCreatedAt
          schema:
            type: string
            format: date-time
            description: The timestamp of the last post retrieved
      responses:
        '200':
          description: Commented posts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                    content:
                      type: string
                    comment_count:
                      type: integer
                    like_count:
                      type: integer
                    scrap_count:
                      type: integer
                    updated_at:
                      type: string
                      format: date-time
                    nickname:
                      type: string
        '404':
          description: No more commented posts found
        '500':
          description: Internal Server Error
